{% extends 'accounts/base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 px-4 py-10">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 text-center text-white">

        <h2 class="text-2xl font-semibold mb-2">🔐 Verify Email</h2>
        <p class="text-sm opacity-80">OTP sent to <b>{{ email }}</b> spam folder.Please check your email spam folder.</p>

        {% if messages %}
            {% for msg in messages %}
                <div class="mt-3 text-red-200 text-sm">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="mt-5">
            {% csrf_token %}

            <input 
                type="text" 
                name="otp" 
                maxlength="6" 
                placeholder="Enter OTP"
                class="w-full px-4 py-3 rounded-lg text-center text-lg tracking-widest 
                       bg-white/20 text-white placeholder-white/60 
                       outline-none focus:ring-2 focus:ring-green-400"
                required
            >

            <button 
                type="submit"
                class="w-full mt-5 py-3 rounded-lg bg-green-500 hover:bg-green-600 
                       transition transform hover:scale-105 font-medium"
            >
                Verify OTP
            </button>
        </form>

        <div class="mt-4 text-sm">
            Didn't receive OTP? 
            <a href="/register/" class="underline hover:text-gray-200">Resend</a>
        </div>

    </div>

</div>

<script>
    const otpInput = document.querySelector("input[name='otp']");

    if (otpInput) {
        otpInput.addEventListener("input", () => {
            otpInput.value = otpInput.value.replace(/[^0-9]/g, '');
        });
        otpInput.focus();
    }
</script>

{% endblock %}
